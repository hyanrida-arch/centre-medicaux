@"
[phases.setup]
nixPkgs = ["php83", "php83Packages.composer", "nodejs_20", "npm"]

[phases.install]
cmds = [
  "composer install --no-dev --optimize-autoloader --no-interaction --ignore-platform-reqs",
  "npm ci"
]

[phases.build]
cmds = [
  "npm run build"
]

[start]
cmd = "php artisan migrate --force && php -S 0.0.0.0:`$PORT -t public"
"@ | Set-Content -Path nixpacks.toml -Encoding ascii